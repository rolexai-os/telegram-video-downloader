services:
  - type: web
    name: telegram-video-downloader
    runtime: docker
    plan: free
    branch: main
    autoDeploy: true
    healthCheckPath: /healthz
    envVars:
      - key: BOT_TOKEN
        sync: false
      - key: WEBHOOK_SECRET
        generateValue: true
      - key: DOWNLOAD_DIR
        value: /tmp/downloads
      - key: MAX_FILE_SIZE_MB
        value: "0"
      - key: TELEGRAM_UPLOAD_CHUNK_MB
        value: "45"
      - key: STORAGE_QUOTA_GB
        value: "0"
      - key: STORAGE_BACKEND
        value: local
      - key: KEEP_MEDIA
        value: "0"
      - key: APP_LOG_FILE
        value: /tmp/bot.log
      - key: COOKIES_FROM_BROWSER
        value: ""
      - key: MAX_CONCURRENT_DOWNLOADS
        value: "1"
      - key: MAX_LINKS_PER_MESSAGE
        value: "10"
      - key: MAX_QUEUE_PER_USER
        value: "5"
      - key: RATE_LIMIT_SECONDS
        value: "2"
      - key: ADMIN_USER_IDS
        value: ""
      # Render Secret Files are mounted at /etc/secrets/<filename>.
      # Upload only authorized cookie jars in the Render Dashboard.
      - key: COOKIES_FACEBOOK
        value: /etc/secrets/facebook.txt
      - key: COOKIES_TIKTOK
        value: /etc/secrets/tiktok.txt
      - key: COOKIES_X
        value: /etc/secrets/x.txt
      - key: COOKIES_REDDIT
        value: /etc/secrets/reddit.txt
      - key: COOKIES_VIMEO
        value: /etc/secrets/vimeo.txt
      - key: COOKIES_DAILYMOTION
        value: /etc/secrets/dailymotion.txt
      - key: COOKIES_SNAPCHAT
        value: /etc/secrets/snapchat.txt
      - key: COOKIES_PINTEREST
        value: /etc/secrets/pinterest.txt
      - key: COOKIES_LINKEDIN
        value: /etc/secrets/linkedin.txt
      - key: COOKIES_TWITCH
        value: /etc/secrets/twitch.txt
      - key: COOKIES_THREADS
        value: /etc/secrets/threads.txt
      - key: COOKIES_TELEGRAM
        value: /etc/secrets/telegram.txt
      - key: COOKIES_GENERIC
        value: /etc/secrets/generic.txt
