name: Validate

on:
  push:
    branches: ["main"]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Compile Python files
        run: python -m compileall -q bot.py runner.py web.py update.py
      - name: Import and entrypoint smoke test
        run: |
          python - <<'PY'
          import inspect
          import bot
          import runner
          assert callable(bot.main)
          assert callable(bot.download)
          assert callable(bot.user_error_message)
          assert "will not bypass authentication" in bot.user_error_message("You need to log in to access this content")
          assert "profile" in inspect.signature(runner.robust_sync_download).parameters
          assert "captions" in inspect.signature(runner.robust_sync_download).parameters
          assert "profile" in inspect.signature(runner.robust_download_media).parameters
          assert "captions" in inspect.signature(runner.robust_download_media).parameters
          assert callable(runner.analyze_cmd)
          assert callable(runner.pause_cmd)
          assert callable(runner.resume_cmd)
          assert callable(runner.stats_cmd)
          print("application/runner wiring OK")
          PY
      - name: Check release wiring
        run: |
          test -s VERSION
          test -f bot.py
          test -f runner.py
          test -f web.py
          test -f Dockerfile
          test -f render.yaml
          test -f requirements.txt
          test -f .env.example
          grep -q 'runner.py' web.py
          grep -q 'runner.py' README.md
          grep -q 'yt-dlp' requirements.txt
          grep -q 'gunicorn' requirements.txt
          grep -q 'PLAYLIST_MAX_ITEMS' .env.example
          grep -q 'PROGRESS_UPDATE_SECONDS' .env.example
          grep -q 'DEFAULT_AUDIO_QUALITY' .env.example
          test "$(cat VERSION)" = "1.4.1"
