name: Validate

on:
  push:
    branches: ["main"]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Compile Python files
        run: python -m compileall -q bot.py runner.py admin_panel.py web.py update.py
      - name: Import and entrypoint smoke test
        run: |
          python - <<'PY'
          import inspect
          import bot
          import runner
          import admin_panel
          assert callable(bot.main)
          assert callable(bot.download)
          assert not bot.is_disabled_url("https://www.instagram.com/reel/test/")
          assert not bot.is_disabled_url("https://www.youtube.com/watch?v=test")
          class FakeMessage:
              text = "🎬 https://x.com/example/status/1 and https://www.tiktok.com/@example/video/1."
              caption = None
              entities = ()
              caption_entities = ()
          assert bot.extract_message_urls(FakeMessage()) == ["https://x.com/example/status/1", "https://www.tiktok.com/@example/video/1"]
          assert callable(bot.user_error_message)
          assert "will not bypass authentication" in bot.user_error_message("You need to log in to access this content")
          assert "profile" in inspect.signature(runner.robust_sync_download).parameters
          assert "captions" in inspect.signature(runner.robust_sync_download).parameters
          assert "profile" in inspect.signature(runner.robust_download_media).parameters
          assert "captions" in inspect.signature(runner.robust_download_media).parameters
          assert callable(runner.analyze_cmd)
          assert callable(runner.pause_cmd)
          assert callable(runner.resume_cmd)
          assert callable(runner.stats_cmd)
          assert callable(runner.admin_panel.panel_cmd)
          assert callable(runner.admin_panel.panel_callback)
          print("application/runner wiring OK")
          PY
      - name: Check release wiring
        run: |
          test -s VERSION
          test -f bot.py
          test -f runner.py
          test -f web.py
          test -f Dockerfile
          test -f render.yaml
          test -f requirements.txt
          test -f .env.example
          grep -q 'runner.py' web.py
          grep -q 'supervise_bot' web.py
          grep -q 'HTTPXRequest' runner.py
          grep -q 'add_error_handler' runner.py
          grep -q 'TG_WATCHDOG_INTERVAL' runner.py
          grep -q 'INSTANCE_LOCK_FILE' runner.py
          grep -q 'CONFLICT_EXIT_CODE' runner.py
          grep -q 'exit_code == 75' web.py
          grep -q 'audit_logs' bot.py
          grep -q 'servers' bot.py
          grep -q 'SERVER_HEARTBEAT_INTERVAL' runner.py
          grep -q 'TypeHandler' runner.py
          grep -q 'ap|logs' admin_panel.py
          grep -q 'ap|servers' admin_panel.py
          grep -q 'TELEGRAM_UPLOAD_CHUNK_MB' bot.py
          grep -q 'ensure_supported_url' runner.py
          grep -q 'extract_message_urls' bot.py
          grep -q 'filters.CAPTION' bot.py
          grep -q 'yt-dlp\[default\]' requirements.txt
          grep -q 'deno' Dockerfile
          grep -Eq 'apt-get install.*unzip' Dockerfile
          grep -q 'BotCommand' runner.py
          grep -q 'audit_update' runner.py
          grep -q 'systemlog' admin_panel.py
          grep -q 'privacy' admin_panel.py
          ! grep -RniE 'COOKIES_|cookie_file_for_url|cookiesfrombrowser|cookiefile|cookie_platform' bot.py runner.py admin_panel.py
          grep -q 'analytics' admin_panel.py
          grep -q 'health' admin_panel.py
          grep -q 'runtime' admin_panel.py
          grep -q 'history' admin_panel.py
          grep -q 'runner.py' README.md
          grep -q 'yt-dlp' requirements.txt
          grep -q 'gunicorn' requirements.txt
          grep -q 'PLAYLIST_MAX_ITEMS' .env.example
          grep -q 'PROGRESS_UPDATE_SECONDS' .env.example
          grep -q 'DEFAULT_AUDIO_QUALITY' .env.example
          test "$(cat VERSION)" = "1.15.0"
          test -f admin_panel.py
